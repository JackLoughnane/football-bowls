name: Build historical PL pilot from epldata
on:
  workflow_dispatch:
jobs:
  historical_pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Download and convert historical epldata tables
        run: Rscript scripts/extract_epldata.R
      - name: Build career totals and candidate IDs
        run: python scripts/build_epldata_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: epldata-historical-pilot-UNVERIFIED
          path: output/epldata/*.csv
