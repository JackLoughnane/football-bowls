name: Extract official 2024-25 PL statistics for review
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pdfplumber==0.11.7'
      - name: Extract 2024-25 official handbook tables for audit
        run: python scripts/extract_2024_25_handbook.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-2024-25-handbook-extraction-review
          path: output/season_2024_25/
          retention-days: 30
